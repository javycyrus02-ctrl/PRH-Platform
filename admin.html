<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRH | Admin Approval</title>
  <link rel="stylesheet" href="wallet.css" />
  <style>
    body { margin: 0; font-family: "Avenir Next", Arial, sans-serif; background: #f2f6f3; color: #1e302d; }
    .admin-shell { max-width: 980px; margin: 28px auto; padding: 0 20px 40px; }
    .admin-topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .admin-brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; color: #17483f; text-decoration: none; }
    .admin-brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; color: white; background: #17483f; }
    .admin-card { background: white; border: 1px solid #e0e9e4; border-radius: 12px; padding: 20px; box-shadow: 0 10px 28px rgba(23,72,63,.05); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .admin-header h1 { margin: 0; font-size: 2rem; }
    .admin-list { display: grid; gap: 14px; }
    .admin-request { display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid #e0e9e4; border-radius: 10px; padding: 16px; }
    .admin-request-main strong { display: block; font-size: 1.05rem; }
    .admin-request-main p { margin: 6px 0 0; color: #6e7d78; font-size: 0.9rem; }
    .admin-request-side { display: flex; align-items: center; gap: 12px; }
    .admin-actions { display: flex; gap: 8px; }
    .admin-btn { border: none; border-radius: 8px; padding: 9px 12px; font-weight: 700; cursor: pointer; }
    .approve { background: #17483f; color: white; }
    .reject { background: #fff0ef; color: #a83f38; border: 1px solid #e7b9b5; }
    .empty { color: #6e7d78; text-align: center; padding: 18px; border: 1px dashed #cbd9d1; border-radius: 8px; }
    .status { margin-top: 12px; min-height: 1.2em; color: #6e7d78; }
    .status.error { color: #a83f38; }
    .status.success { color: #247650; }
    .admin-reward { margin: 22px 0; padding-bottom: 22px; border-bottom: 1px solid #e0e9e4; }
    .admin-reward h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .admin-reward form { display: flex; align-items: center; gap: 10px; }
    .admin-reward select { min-width: 0; flex: 1; border: 1px solid #cbd9d1; border-radius: 8px; padding: 10px; font: inherit; }
    @media (max-width: 560px) { .admin-reward form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-topbar">
      <a class="admin-brand" href="index.html"><span class="admin-brand-mark">PRH</span><span>Admin approval</span></a>
      <a class="wallet-admin-link" href="index.html">User dashboard</a>
    </header>

    <main class="admin-card">
      <div class="admin-header">
        <h1>Pending requests</h1>
        <button class="wallet-button wallet-button-quiet" id="refreshAdmin" type="button">Refresh</button>
      </div>
      <div class="status" id="adminStatus" aria-live="polite"></div>
      <section class="admin-reward" aria-labelledby="rewardUserHeading">
        <h2 id="rewardUserHeading">Grant a spin</h2>
        <form id="grantSpinForm">
          <label for="spinUserSelect">Choose a user</label>
          <select id="spinUserSelect" required></select>
          <button class="admin-btn approve" type="submit">Grant one spin</button>
        </form>
      </section>
      <div class="admin-list" id="adminList"></div>
    </main>
  </div>

  <script>
    function getAccounts() {
      try {
        const accounts = JSON.parse(localStorage.getItem('prhAccounts'));
        return Array.isArray(accounts) ? accounts : [];
      } catch {
        return [];
      }
    }

    function getRequestQueue() {
      try {
        const queue = JSON.parse(localStorage.getItem('prhRequestQueue'));
        return Array.isArray(queue) ? queue : [];
      } catch {
        return [];
      }
    }

    function saveAccounts(accounts) {
      localStorage.setItem('prhAccounts', JSON.stringify(accounts));
    }

    function saveRequestQueue(queue) {
      localStorage.setItem('prhRequestQueue', JSON.stringify(queue));
    }

    function formatGhs(amount) {
      return `GHS ${Number(amount).toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    function renderSpinUsers() {
      const select = document.getElementById('spinUserSelect');
      const accounts = getAccounts();
      select.innerHTML = '';

      if (!accounts.length) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No users found';
        select.append(option);
        select.disabled = true;
        return;
      }

      select.disabled = false;
      accounts.forEach((account) => {
        const option = document.createElement('option');
        option.value = account.email;
        option.textContent = `${account.name || account.email} (${Number(account.spinCredits) || 0} spins)`;
        select.append(option);
      });
    }

    function renderAdmin() {
      const list = document.getElementById('adminList');
      renderSpinUsers();
      const requests = getRequestQueue().filter((request) => request.status === 'pending');
      list.innerHTML = '';

      if (!requests.length) {
        list.innerHTML = '<div class="empty">No pending deposit or withdrawal requests.</div>';
        return;
      }

      requests.forEach((request) => {
        const row = document.createElement('div');
        row.className = 'admin-request';

        const main = document.createElement('div');
        main.className = 'admin-request-main';
        const heading = document.createElement('strong');
        heading.textContent = `${request.kind === 'deposit' ? 'Deposit request' : 'Withdrawal request'} · ${request.name || request.email}`;
        main.append(heading);

        const addDetail = (text) => {
          const detail = document.createElement('p');
          detail.textContent = text;
          main.append(detail);
        };

        addDetail(request.email);
        addDetail(`Submitted: ${new Date(request.createdAt).toLocaleString()}`);
        if (request.kind === 'deposit' && request.mobileMoneyName) {
          addDetail(`Mobile money account name: ${request.mobileMoneyName}`);
        }
        if (request.kind === 'withdrawal' && (request.withdrawalNumber || request.withdrawalNetwork)) {
          addDetail(`Withdrawal mobile money: ${request.withdrawalNumber || 'Number not provided'} · ${request.withdrawalNetwork || 'Network not provided'}`);
        }
        addDetail(request.note || 'No note provided');

        const side = document.createElement('div');
        side.className = 'admin-request-side';
        side.innerHTML = `
          <strong>${formatGhs(request.amount)}</strong>
          <div class="admin-actions">
            <button class="admin-btn approve" data-action="approve" data-id="${request.id}" type="button">Approve</button>
            <button class="admin-btn reject" data-action="reject" data-id="${request.id}" type="button">Reject</button>
          </div>
        `;

        row.append(main, side);
        list.append(row);
      });
    }

    function setStatus(message, kind = '') {
      const status = document.getElementById('adminStatus');
      status.textContent = message;
      status.className = `status${kind ? ` ${kind}` : ''}`;
    }

    function approveRequest(requestId, approve) {
      const queue = getRequestQueue();
      const request = queue.find((item) => item.id === requestId);
      const accounts = getAccounts();
      if (!request) return;

      const account = accounts.find((item) => item.email === request.email);
      if (!account) {
        setStatus('User account could not be found.', 'error');
        return;
      }

      if (approve) {
        if (request.kind === 'deposit') {
          account.balance = Number((Number(account.balance) + Number(request.amount)).toFixed(2));
        } else {
          if (Number(account.balance) < Number(request.amount)) {
            setStatus('This withdrawal cannot be approved because the balance is too low.', 'error');
            return;
          }
          account.balance = Number((Number(account.balance) - Number(request.amount)).toFixed(2));
        }
      }

      request.status = approve ? 'approved' : 'rejected';
      request.reviewedAt = Date.now();
      saveAccounts(accounts);
      saveRequestQueue(queue);
      setStatus(approve ? 'Request approved.' : 'Request rejected.', 'success');
      renderAdmin();
    }

    document.getElementById('refreshAdmin').addEventListener('click', renderAdmin);
    document.getElementById('grantSpinForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('spinUserSelect').value;
      const accounts = getAccounts();
      const account = accounts.find((item) => item.email === email);
      if (!account) {
        setStatus('Choose a valid user before granting a spin.', 'error');
        return;
      }

      account.spinCredits = (Number(account.spinCredits) || 0) + 1;
      saveAccounts(accounts);
      setStatus(`One spin granted to ${account.name || account.email}.`, 'success');
      renderAdmin();
    });
    document.getElementById('adminList').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-id]');
      if (!button) return;
      const requestId = button.dataset.id;
      const approve = button.dataset.action === 'approve';
      approveRequest(requestId, approve);
    });

    renderAdmin();
  </script>
</body>
</html>
